# ---- Stationary Shop configuration -------------------------------------
# Database credentials come from environment variables (never commit real passwords).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stationary_shop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate must NEVER change the schema - it only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# All JSON uses snake_case so field names equal the database column names (product_name, stock_qty ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# The Spring Boot server also serves the ../frontend folder, so http://localhost:8080 shows the app.
# Run the backend from the 'backend' folder, or set FRONTEND_DIR to the absolute path of the frontend folder.
spring.web.resources.static-locations=file:${FRONTEND_DIR:../frontend/},classpath:/static/

server.port=${PORT:8080}
spring.application.name=Stationary Shop

# ---- API access from another address (only needed if the frontend is NOT served by this application) ----
# Comma-separated list of allowed origins, e.g. VS Code Live Server.  Environment variable: CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ---- never send stack traces, exception text or binding details to the browser ----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.jpa.show-sql=false
