<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Stationary Shop</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261026">
</head>
<body data-page="reports.html" data-title="Reports">
<main>
  <div class="page-header"><div><h1>Reports</h1><p>Every figure comes from SQL views and queries on the live database.</p></div></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-sales">Sales and revenue</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-inv">Inventory and low stock</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-more">Top products and customers</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-sales">
      <div class="card mb-3 no-print"><div class="card-body"><div class="row g-2 align-items-end">
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="sfrom">From</label><input type="date" id="sfrom" class="form-control"></div>
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="sto">To</label><input type="date" id="sto" class="form-control"></div>
        <div class="col-md-6 d-flex gap-2"><button class="btn btn-primary" id="sRun"><i class="bi bi-funnel me-1"></i>Show report</button>
          <button class="btn btn-outline-secondary" id="sClear">Clear dates</button><button class="btn btn-outline-primary ms-auto" id="sPrint"><i class="bi bi-printer me-1"></i>Print</button></div>
      </div></div></div>
      <div id="salesReport">Loading…</div>
    </div>
    <div class="tab-pane fade" id="tab-inv">
      <div class="card mb-3 no-print"><div class="card-body"><div class="row g-2 align-items-end">
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="icat">Category</label><select id="icat" class="form-select"></select></div>
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="istatus">Stock status</label><select id="istatus" class="form-select">
          <option value="">All</option><option value="needs_restock">Needs restocking</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option><option>Inactive</option></select></div>
        <div class="col-md-6 d-flex gap-2"><button class="btn btn-primary" id="iRun"><i class="bi bi-funnel me-1"></i>Show report</button><button class="btn btn-outline-primary ms-auto" id="iPrint"><i class="bi bi-printer me-1"></i>Print</button></div>
      </div></div></div>
      <div id="invReport">Loading…</div>
    </div>
    <div class="tab-pane fade" id="tab-more"><div class="row g-3">
      <div class="col-lg-6"><div class="card"><div class="card-header">Top-selling products</div><div id="topReport"></div></div></div>
      <div class="col-lg-6"><div class="card"><div class="card-header">Customer spending</div><div id="custReport"></div></div></div>
    </div></div>
  </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/chartjs/chart.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js?v=20261026"></script>
</body>
</html>
