<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales / Orders | Stationary Shop</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261026">
</head>
<body data-page="orders.html" data-title="Sales / Orders">
<main>
  <div class="page-header"><div><h1>Sales / Orders</h1><p>Point of sale: stock, loyalty points and payment are handled in one safe transaction.</p></div></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-pos"><i class="bi bi-cart3 me-1"></i>New sale</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-orders"><i class="bi bi-list-ul me-1"></i>Orders</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-pos"><div class="row g-3">
      <div class="col-lg-7"><div class="card"><div class="card-body">
        <div class="input-group mb-3"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input type="search" id="pq" class="form-control" placeholder="Search products to add" aria-label="Search products"></div>
        <div id="prodGrid" class="product-grid"></div>
      </div></div></div>
      <div class="col-lg-5"><div class="card cart-card"><div class="card-body">
        <div id="saleError"></div>
        <div class="row g-2 mb-3">
          <div class="col-sm-6"><label class="form-label mb-1" for="custSel">Customer</label><select id="custSel" class="form-select"></select></div>
          <div class="col-sm-6"><label class="form-label mb-1" for="empSel">Served by <span class="text-danger">*</span></label><select id="empSel" class="form-select"></select></div>
        </div>
        <div id="cartBox"></div>
        <div class="row g-2 align-items-center my-2">
          <div class="col-6"><label class="form-label mb-0" for="disc">Discount (0–50 %)</label></div>
          <div class="col-6"><input type="number" id="disc" class="form-control form-control-sm" min="0" max="50" step="0.01" value="0"></div>
        </div>
        <div class="total-line"><span>Subtotal</span><span id="subTxt">₹0.00</span></div>
        <div class="total-line"><span>Discount</span><span id="discTxt">- ₹0.00</span></div>
        <div class="total-line grand"><span>Payable <small class="text-muted fw-normal">(estimate)</small></span><span id="totalTxt">₹0.00</span></div>
        <div class="mt-3 mb-3"><div class="form-label mb-1">Payment method</div>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="pm" id="pmCash" value="Cash" checked><label class="btn btn-outline-primary" for="pmCash"><i class="bi bi-cash-coin me-1"></i>Cash</label>
            <input type="radio" class="btn-check" name="pm" id="pmCard" value="Card"><label class="btn btn-outline-primary" for="pmCard"><i class="bi bi-credit-card me-1"></i>Card</label>
            <input type="radio" class="btn-check" name="pm" id="pmUpi" value="UPI"><label class="btn btn-outline-primary" for="pmUpi"><i class="bi bi-phone me-1"></i>UPI</label>
          </div></div>
        <button class="btn btn-primary w-100 btn-lg" id="confirmBtn"><i class="bi bi-check2-circle me-1"></i>Confirm sale</button>
        <button class="btn btn-link w-100 mt-1" id="clearBtn">Clear cart</button>
      </div></div></div>
    </div></div>
    <div class="tab-pane fade" id="tab-orders"><div class="card"><div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="ofrom">From</label><input type="date" id="ofrom" class="form-control"></div>
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="oto">To</label><input type="date" id="oto" class="form-control"></div>
        <div class="col-md-3 col-6"><label class="form-label mb-0 small" for="ostatus">Status</label><select id="ostatus" class="form-select"><option value="">All</option><option>Completed</option><option>Pending</option><option>Cancelled</option></select></div>
      </div>
      <div id="orderTable"></div>
    </div></div></div>
  </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
