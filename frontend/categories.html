<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories | Stationary Shop</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261026">
</head>
<body data-page="categories.html" data-title="Categories">
<main id="crud-root"></main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>

initCrud({
  endpoint: '/api/categories', entity: 'Category', plural: 'Categories', subtitle: 'Groups used to organise products.',
  idKey: 'category_id', nameKey: 'category_name', searchPlaceholder: 'Search by name or description',
  columns: [
    { key: 'category_id', label: 'ID' }, { key: 'category_name', label: 'Category' }, { key: 'description', label: 'Description' },
    { key: 'product_count', label: 'Products', num: true }
  ],
  fields: [
    { key: 'category_name', label: 'Category name', required: true, maxlength: 50 },
    { key: 'description', label: 'Description', type: 'textarea', maxlength: 200, wide: true }
  ]
});
</script>
</body>
</html>
