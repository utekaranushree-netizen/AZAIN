<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Stationary Shop</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261026">
</head>
<body data-page="inventory.html" data-title="Inventory">
<main>
  <div class="page-header"><div><h1>Inventory</h1><p>Stock levels follow each product's reorder level. Stock changes only through sales and received purchase orders.</p></div>
    <a class="btn btn-primary" href="purchase-orders.html"><i class="bi bi-cart-plus me-1"></i>Restock with a purchase order</a></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-levels">Stock levels</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-log">Stock movement history</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-levels"><div class="card"><div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-4"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input type="search" id="iq" class="form-control" placeholder="Search product or brand" aria-label="Search"></div></div>
        <div class="col-md-3 col-6"><select id="icat" class="form-select" aria-label="Category"></select></div>
        <div class="col-md-3 col-6"><select id="istatus" class="form-select" aria-label="Stock status">
          <option value="">Status: all</option><option value="needs_restock">Needs restocking (low + out)</option>
          <option>In Stock</option><option>Low Stock</option><option>Out of Stock</option><option>Inactive</option></select></div>
      </div>
      <div id="invTable"></div>
    </div></div></div>
    <div class="tab-pane fade" id="tab-log"><div class="card"><div class="card-body">
      <div class="row g-2 mb-3"><div class="col-md-5"><select id="logProduct" class="form-select" aria-label="Product"></select></div></div>
      <div id="logTable"></div>
    </div></div></div>
  </div>
</main>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
